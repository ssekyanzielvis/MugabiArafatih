services:
  - type: web
    name: professional-portfolio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - src/**
        - public/**
        - package.json
        - next.config.ts
        - tsconfig.json
      ignoredPaths:
        - README.md
        - "*.md"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://bqlvprmmtmobobyygnba.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
